# Self-hosted Judge0 for Practice Test code execution (Coding/Debugging/OutputBased
# question types — SQL is graded in-process via sql.js, no Judge0 needed for it).
#
# Usage:
#   docker compose -f docker-compose.judge0.yml up -d
#   # then set JUDGE0_API_URL=http://localhost:2358 in backend/.env
#
# Based on Judge0's official self-hosting guide (https://judge0.com hosts the
# upstream images). isolate-based sandboxing requires the container to run
# privileged with cgroup access — this is expected for Judge0 and is fine on a
# single trusted host; do not expose port 2358 publicly without adding
# JUDGE0_AUTH_TOKEN (X-Auth-Token) in front of it.
version: '3.8'

services:
  judge0-server:
    image: judge0/judge0:1.13.1
    privileged: true
    ports:
      - '2358:2358'
    env_file: judge0.conf
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-workers:
    image: judge0/judge0:1.13.1
    privileged: true
    command: ['./scripts/workers']
    env_file: judge0.conf
    depends_on:
      - judge0-db
      - judge0-redis
    restart: unless-stopped

  judge0-db:
    image: postgres:16
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: judge0
    volumes:
      - judge0-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  judge0-redis:
    image: redis:7
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - judge0-redis-data:/data
    restart: unless-stopped

volumes:
  judge0-db-data:
  judge0-redis-data:
