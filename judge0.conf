# Judge0 server/worker configuration, consumed by docker-compose.judge0.yml.
# Matches the judge0-db / judge0-redis service names+credentials in that file —
# change both together if you change one.

# ── Database ──────────────────────────────────────────────────────────
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0

# ── Redis (job queue between server and workers) ─────────────────────
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=

# ── Execution ─────────────────────────────────────────────────────────
# Our judge0Client.js always calls with wait=true (one HTTP round-trip per
# test case) — this must stay enabled.
ENABLE_WAIT_RESULT=true
MAX_QUEUE_SIZE=100
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=256000

# ── Auth ──────────────────────────────────────────────────────────────
# If set, every request must include header `X-Auth-Token: <value>` — must
# match JUDGE0_AUTH_TOKEN in backend/.env. Leave both blank for local/dev use
# behind a trusted network only.
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=
